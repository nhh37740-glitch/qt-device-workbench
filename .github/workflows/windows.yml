name: build-test-binary-delivery
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install project Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE/.tools/Qt" --archives qtbase qttools
      - name: Build real DLLs and executables
        shell: pwsh
        run: ./scripts/build.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64"
      - name: Test modules and real processes
        shell: pwsh
        run: ./scripts/test.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64"
      - name: Package and verify binary-only deployment
        shell: pwsh
        run: ./scripts/package.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-binaries-and-test-evidence
          path: |
            dist/**/*.zip
            build/module-tests.xml
            build/process-evidence/
            build/delivery-evidence/
